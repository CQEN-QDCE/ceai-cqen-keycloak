services:
  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - '127.0.0.1:3000:80'
      - '127.0.0.1:25:25'
      - '127.0.0.1:143:143'
    environment:
      #Specifies the server hostname. Used in auto-generated TLS certificate if enabled.
      - ServerOptions__HostName=${SERVER_OPTIONS__HOSTNAME}
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20

  keycloak:
      build:
        context: .
        # Le Dockerfile définit la version par défaut.
        args:
          - IMG_VERSION
          - ENV=${ENV}
      environment:
        KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
        KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
        KC_DB: ${KC_DB}
        KC_DB_URL: ${KC_DB_URL}
        KC_HOSTNAME: ${KC_HOSTNAME}
        KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH}
        KC_DB_USERNAME: ${KC_DB_USERNAME}
        KC_DB_PASSWORD: ${KC_DB_PASSWORD}
        KC_FEATURES:
        ENV: ${ENV}
        KC_METRICS_ENABLED: ${KC_METRICS_ENABLED}
        KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED}
        KC_PROXY_HEADERS: ${KC_PROXY_HEADERS}
        KC_HTTP_MANAGEMENT_PORT: ${KC_HTTP_MANAGEMENT_PORT}


      ports:
        - '127.0.0.1:9000:9000'
        - '127.0.0.1:8080:8080'
      depends_on:
        smtp4dev:
          condition: service_started
        postgres:
          condition: service_healthy
      volumes:
        - ./customization/themes/cqen/:/opt/keycloak/themes/cqen/
