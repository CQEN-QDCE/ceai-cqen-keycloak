name: Validation du Realm Keycloak

# Déclenchement : Après le succès d'un workflow de déploiement (remplacez 'deploy-keycloak' par le nom de votre workflow)
# OU manuellement pour tester l'environnement
on:
  workflow_dispatch:
  pull_request:        # Déclenchement sur pull request
    branches:
      - main

jobs:
  test-realm-configuration:
    name: Tests d'API Admin Keycloak
    runs-on: ubuntu-latest
    environment: test

    env:
      KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL_TEST }}
      KC_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USERNAME_TEST }}
      KC_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD_TEST }}
      # Nom du realm déployé que l'on souhaite tester
      TARGET_REALM: 'mon-realm-deploiement' 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' 

      - name: Installer les dépendances de test
        run: |
          pip install --upgrade pip
          # Installation du framework de test et de la librairie HTTP
          pip install pytest requests

      - name: Exécuter les tests du Realm Keycloak
        # On exécute pytest sur le répertoire contenant nos tests
        run: pytest tests/
        working-directory: .