name: Deploy Keycloak Realm (test)

on:
  workflow_dispatch:  # Déclenchement manuel uniquement
  pull_request:        # Déclenchement sur pull request
    branches:
      - main

jobs:
  deploy-realm:
    runs-on: ubuntu-latest
    environment: test

    env:
      KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL_TEST }}
      USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME_TEST }}
      PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD_TEST }}
      REALM_FILE: ${{ secrets.KEYCLOAK_REALM_NAME_TEST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq and curl
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Valider le fichier JSON
        run: |
          if [ ! -f "$REALM_FILE" ]; then
            echo "Fichier $REALM_FILE introuvable"
            exit 1
          fi
          
          if ! jq empty "$REALM_FILE"; then
            echo "Fichier JSON invalide"
            exit 1
          fi
          
          REALM_NAME=$(jq -r '.realm // empty' "$REALM_FILE")
          if [ -z "$REALM_NAME" ]; then
            echo "Le champ 'realm' est manquant"
            exit 1
          fi
          
          echo "REALM_NAME=$REALM_NAME" >> $GITHUB_ENV
          echo "Realm validé: $REALM_NAME"

      - name: Extract realm name
        id: realm
        run: |
          REALM_NAME=$(jq -r '.realm' "$REALM_FILE")
          echo "name=$REALM_NAME" >> $GITHUB_OUTPUT
          echo "Realm cible: $REALM_NAME"

      - name: Get access token
        id: get-token
        run: |
          TOKEN=$(curl -s -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=admin-cli" \
            -d "username=$USERNAME" \
            -d "password=$PASSWORD" \
            -d "grant_type=password" | jq -r .access_token)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          
      - name: Check if realm exists
        id: check-realm
        run: |
          STATUS=$(curl -s -o existing_realm.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.get-token.outputs.token }}" \
            "$KEYCLOAK_URL/admin/realms/$REALM_NAME")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Debug realm status
        run: |
          echo "Realm check status: ${{ steps.check-realm.outputs.status }}"
          if [ -f existing_realm.json ]; then
            cat existing_realm.json | jq .
          fi

      - name: Create new realm
        if: steps.check-realm.outputs.status == '404'
        run: |
          echo "🆕 Création du nouveau realm: $REALM_NAME"
            
          RESPONSE=$(curl -s -w "HTTPSTATUS:%{http_code}" -X POST \
            "$KEYCLOAK_URL/admin/realms" \
            -H "Authorization: Bearer ${{ steps.get-token.outputs.token }}" \
            -H "Content-Type: application/json" \
            --data-binary @"$REALM_FILE")
            
          HTTP_CODE=$(echo $RESPONSE | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          BODY=$(echo $RESPONSE | sed -e 's/HTTPSTATUS:.*//g')
            
          if [ "$HTTP_CODE" -eq 201 ] || [ "$HTTP_CODE" -eq 204 ]; then
            echo "Realm créé avec succès"
          else
            echo "Échec de la création du realm (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi
  
      - name: Update existing realm
        if: steps.check-realm.outputs.status == '200'
        run: |
          echo "🔄 Comparaison et mise à jour du realm existant"
            
          # Nettoyer les champs qui changent automatiquement pour la comparaison
          jq 'del(.id, .accessTokenLifespan, .ssoSessionIdleTimeout, .ssoSessionMaxLifespan)' existing_realm.json > existing_clean.json
          jq 'del(.id, .accessTokenLifespan, .ssoSessionIdleTimeout, .ssoSessionMaxLifespan)' "$REALM_FILE" > new_clean.json
            
          if ! diff -q existing_clean.json new_clean.json >/dev/null 2>&1; then
            echo "📝 Différences détectées, mise à jour en cours..."
              
            RESPONSE=$(curl -s -w "HTTPSTATUS:%{http_code}" -X PUT \
              "$KEYCLOAK_URL/admin/realms/$REALM_NAME" \
              -H "Authorization: Bearer ${{ steps.get-token.outputs.token }}" \
              -H "Content-Type: application/json" \
              --data-binary @"$REALM_FILE")
              
            HTTP_CODE=$(echo $RESPONSE | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
            BODY=$(echo $RESPONSE | sed -e 's/HTTPSTATUS:.*//g')
              
            if [ "$HTTP_CODE" -eq 204 ] || [ "$HTTP_CODE" -eq 200 ]; then
              echo "Realm mis à jour avec succès"
            else
              echo "Échec de la mise à jour (HTTP $HTTP_CODE)"
              echo "$BODY"
              exit 1
            fi
          else
            echo "Aucune modification détectée, realm inchangé"
          fi
  
      - name: Verify deployment
        run: |
          echo "Vérification finale du déploiement"
            
          STATUS=$(curl -s -w "%{http_code}" -o /dev/null \
            -H "Authorization: Bearer ${{ steps.get-token.outputs.token }}" \
            "$KEYCLOAK_URL/admin/realms/$REALM_NAME")
            
          if [ "$STATUS" = "200" ]; then
            echo "Déploiement vérifié avec succès"
            echo "Realm '$REALM_NAME' est accessible"
          else
            echo "Échec de la vérification (HTTP $STATUS)"
            exit 1
          fi
  
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f existing_realm.json existing_clean.json new_clean.json

      # - name: Create realm if missing
      #   if: steps.check-realm.outputs.status == '404'
      #   run: |
      #     curl -s -X POST "$KEYCLOAK_URL/admin/realms" \
      #       -H "Authorization: Bearer ${{ steps.get-token.outputs.token }}" \
      #       -H "Content-Type: application/json" \
      #       --data-binary @realm-export.json

