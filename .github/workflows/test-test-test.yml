name: Validation quotidienne du Realm Keycloak

on:
  workflow_dispatch:  
  pull_request:       
    branches:
      - main
  schedule:
    - cron: '0 10 * * *'   # Tous les jours à 6h00 (heure du Québec)
env:
  AWS_REGION : "ca-central-1"
permissions:
  id-token: write
  contents: read

jobs:
  validate-realm:
    name: Exécution du composite de validation
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: "configure aws credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ASSUME_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Télécharger le Realm depuis S3
        run: |
          mkdir -p realms
          echo "📥 Téléchargement du fichier realm depuis S3..."
          if ! aws s3 cp s3://cqen-dev-logs/realms/test-deploiement.json realms/test-deploiement.json --region $AWS_REGION; then
            echo "❌ Erreur : impossible de télécharger le fichier depuis S3."
            aws sts get-caller-identity
            exit 1
          fi
            echo "✅ Fichier du realm téléchargé : realms/test-deploiement.json"

      - name: Télécharger le Realm depuis S3
        run: |
          mkdir -p realms
          aws s3 cp s3://cqen-dev-logs/realms/test-deploiement.json realms/test-deploiement.json
          echo "✅ Fichier du realm téléchargé depuis S3 : realms/test-deploiement.json"

      - name: Valider et tester le Realm Keycloak
        uses: MCN-CQEN/ceai-cqen-scripts-lib/actions/keycloak-actions/validate-realm@feature/deployer_realms
        with:
          keycloak_url: ${{ secrets.KEYCLOAK_URL_TEST }}
          keycloak_username: ${{ secrets.KEYCLOAK_ADMIN_USERNAME_TEST }}
          keycloak_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD_TEST }}
          keycloak_api_client_secret: ${{ secrets.KEYCLOAK_API_CLIENT_SECRET }}
          realm_to_deploy: realms/test-deploiement.json
          target_realm: mon-realm-deploiement